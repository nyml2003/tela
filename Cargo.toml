[workspace]
resolver = "3"
members = [
    "crates/tela-contract",
    "crates/tela-log",
    "crates/tela-resource-protocol",
    "crates/tela-core",
    "crates/tela-render-raster",
    "crates/tela-render-canvas",
    "crates/tela-render-wgpu",
    "crates/tela-widgets",
    "crates/tela-ui",
    "crates/tela-demo",
    "crates/wgpu-mvp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
