[workspace]
resolver = "3"
members = [
    "crates/tela-contract",
    "crates/tela-app-abi",
    "crates/tela-bundle",
    "crates/tela-guest-runtime",
    "crates/tela-log",
    "crates/tela-fonts",
    "crates/tela-text",
    "crates/tela-icon",
    "crates/tela-resource-protocol",
    "crates/tela-core",
    "crates/tela-render-raster",
    "crates/tela-render-canvas",
    "crates/tela-render-wgpu",
    "crates/tela-widgets",
    "crates/tela-ui",
    "crates/tela-demo",
    "crates/tela-mobile-demo",
    "crates/tela-android-sdk",
    "crates/tela-native-sdk-runtime",
    "crates/tela-webview-sdk",
    "crates/tela-win32-sdk",
    "crates/tela-macos-sdk",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
