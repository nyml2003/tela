[workspace]
resolver = "3"
members = [
    "crates/kernel/contract",
    "crates/kernel/core",
    "crates/ui/foundation",
    "crates/ui/dsl",
    "crates/ui/dsl-macros",
    "crates/ui/headless",
    "crates/ui/mobile-kit",
    "crates/ui/desktop-kit",
    "crates/presentation/resources/fonts",
    "crates/presentation/resources/text",
    "crates/presentation/resources/icons",
    "crates/presentation/resources/protocol",
    "crates/presentation/renderers/raster",
    "crates/presentation/renderers/canvas",
    "crates/presentation/renderers/wgpu",
    "crates/delivery/app-abi",
    "crates/delivery/bridge",
    "crates/delivery/bundle",
    "crates/delivery/guest-runtime",
    "crates/delivery/desktop-runtime",
    "crates/support/log",
    "crates/support/utils",
    "crates/targets/webview",
    "crates/targets/win32",
    "crates/targets/win32-static",
    "crates/targets/macos",
    "crates/targets/android",
    "crates/targets/ios",
    "apps/desktop-demo",
    "apps/mobile-demo",
    "apps/win32-editor",
    "products/desktop-guest",
    "products/mobile-guest",
    "products/ios",
    "products/win32-editor",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
