[package]
name = "tela-android-sdk"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Tela Android GameActivity development SDK host"

[lib]
name = "main"
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"
pollster = "0.4"
tela-app-abi = { path = "../tela-app-abi" }
tela-contract = { path = "../tela-contract" }
tela-guest-runtime = { path = "../tela-guest-runtime" }
tela-log = { path = "../tela-log" }
tela-render-wgpu = { path = "../tela-render-wgpu" }
ureq = { version = "3.3", default-features = false, features = ["rustls"] }
wgpu = "30"
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "android-game-activity"] }

# Android JNI and `android_main` exports require explicit Rust 2024 unsafe ABI attributes.
# Keep that narrowly scoped to this FFI crate; all portable workspace crates inherit `forbid`.
[lints.rust]
unsafe_code = "allow"
