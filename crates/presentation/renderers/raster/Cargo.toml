[package]
name = "tela-render-raster"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "tela 软件光栅基准后端（仅测试/CI/离线/服务端；像素确定性、无 GPU、std/no_std）"

[features]
default = ["std"]
std = ["dep:png", "dep:tela-text-resources"]
no_std = ["dep:font8x8"]

[dependencies]
tela-contract = { path = "../../../kernel/contract" }
tela-text-resources = { path = "../../resources/text", optional = true }
png = { version = "0.17", optional = true }
font8x8 = { version = "0.3", optional = true, default-features = false, features = ["unicode"] }

[dev-dependencies]
tela-core = { path = "../../../kernel/core" }

[lints]
workspace = true
