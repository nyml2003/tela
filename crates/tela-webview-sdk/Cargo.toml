[package]
name = "tela-webview-sdk"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Tela browser WebView development SDK host"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tela-app-abi = { path = "../tela-app-abi" }
tela-bundle = { path = "../tela-bundle" }
tela-contract = { path = "../tela-contract" }
tela-render-wgpu = { path = "../tela-render-wgpu" }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "console"] }
wgpu = "30"

[lints]
workspace = true
