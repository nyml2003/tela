[package]
name = "tela-target-win32-static"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Win32 static-link shell for statically assembled Tela applications"

[dependencies]
tela-bridge = { path = "../../delivery/bridge", features = ["host"] }
tela-contract = { path = "../../kernel/contract" }
tela-core = { path = "../../kernel/core" }
tela-desktop-runtime = { path = "../../delivery/desktop-runtime" }
tela-ui-dsl = { path = "../../ui/dsl" }

[target.'cfg(target_os = "windows")'.dependencies]
pollster = "0.4"
raw-window-handle = "0.6"
tela-render-wgpu = { path = "../../presentation/renderers/wgpu" }
wgpu = "30"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinInet",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Time",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
# Win32 FFI is isolated in the message-loop module; the rest of this crate remains unsafe-free.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
