[package]
name = "tela-target-win32"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Tela Win32 target host"

[dependencies]
tela-app-abi = { path = "../../delivery/app-abi" }
tela-app-session = { path = "../../delivery/app-session" }
tela-bridge = { path = "../../delivery/bridge", features = ["host"] }
tela-contract = { path = "../../kernel/contract" }
tela-desktop-runtime = { path = "../../delivery/desktop-runtime" }

[target.'cfg(target_os = "windows")'.dependencies]
pollster = "0.4"
raw-window-handle = "0.6"
tela-render-wgpu = { path = "../../presentation/renderers/wgpu" }
ureq = { version = "3.3", default-features = false }
wgpu = "30"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Networking_WinInet",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Time",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
# Win32 FFI is isolated in a dedicated module. The rest of this crate remains unsafe-free.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[[bin]]
name = "tela-win32-host"
path = "src/main.rs"
