[package]
name = "tela-target-android"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Tela Android GameActivity target host"

[lib]
name = "main"
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"
pollster = "0.4"
tela-app-abi = { path = "../../delivery/app-abi" }
tela-contract = { path = "../../kernel/contract" }
tela-guest-runtime = { path = "../../delivery/guest-runtime" }
tela-log = { path = "../../support/log" }
tela-render-wgpu = { path = "../../presentation/renderers/wgpu" }
ureq = { version = "3.3", default-features = false, features = ["rustls"] }
wgpu = "30"
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "android-game-activity"] }

# Android JNI and `android_main` exports require explicit Rust 2024 unsafe ABI attributes.
# Keep that narrowly scoped to this FFI crate; all portable workspace crates inherit `forbid`.
[lints.rust]
unsafe_code = "allow"
