[package]
name = "tela-win32-sdk"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Tela Win32 development SDK host"

[dependencies]
tela-app-abi = { path = "../tela-app-abi" }
tela-bundle = { path = "../tela-bundle" }
tela-contract = { path = "../tela-contract" }
serde_json = "1"
wasmtime = { version = "47.0.3", default-features = false, features = ["cranelift", "runtime"] }

[target.'cfg(target_os = "windows")'.dependencies]
pollster = "0.4"
raw-window-handle = "0.6"
tela-render-wgpu = { path = "../tela-render-wgpu" }
ureq = { version = "3.3", default-features = false }
wgpu = "30"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
# Win32 FFI is isolated in a dedicated module. The rest of this crate remains unsafe-free.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[[bin]]
name = "tela-win32-sdk"
path = "src/main.rs"
