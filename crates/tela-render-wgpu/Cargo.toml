[package]
name = "tela-render-wgpu"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "tela wgpu 渲染后端（游戏内嵌/3D 贴图/浏览器 WebGPU，见 007-6）"

[dependencies]
tela-contract = { path = "../tela-contract" }
tela-log = { path = "../tela-log" }
tela-text = { path = "../tela-text" }
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }

[dev-dependencies]
pollster = "0.4"
naga = { version = "26", features = ["wgsl-in"] }
tela-fonts = { path = "../tela-fonts" }

[lints]
workspace = true
