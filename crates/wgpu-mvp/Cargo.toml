[package]
name = "wgpu-mvp"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "wgpu 26 官方链路最小 MVP（wasm）：验证 wgpu crate 在本环境能否渲染（独立于 tela 任何自定义逻辑）"

[lib]
crate-type = ["cdylib"]

[dependencies]
wgpu = "30"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["console", "HtmlCanvasElement", "Performance"] }
