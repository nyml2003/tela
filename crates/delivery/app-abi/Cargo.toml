[package]
name = "tela-app-abi"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Tela application WASM ABI and versioned frame wire format"

[dependencies]
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
tela-contract = { path = "../../kernel/contract" }
tela-app-session = { path = "../app-session" }

[lints.rust]
# The library itself keeps `#![forbid(unsafe_code)]`. Integration tests expand
# `export_guest!`, whose audited FFI exports locally allow unsafe attributes.
unsafe_code = "deny"
