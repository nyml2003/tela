[package]
name = "tela-desktop-runtime"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Desktop dynamic guest cache and lifecycle runtime"

[dependencies]
tela-bridge = { path = "../bridge", features = ["host"] }
tela-utils = { path = "../../support/utils" }
tela-bundle = { path = "../bundle" }
tela-guest-runtime = { path = "../guest-runtime" }

[dev-dependencies]
tela-app-abi = { path = "../app-abi" }
serde_json = "1"

[lints]
workspace = true

[[bin]]
name = "tela-sdk-verify"
path = "src/bin/tela-sdk-verify.rs"
