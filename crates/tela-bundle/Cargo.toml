[package]
name = "tela-bundle"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Tela development application bundle format and validation"

[dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
tela-app-abi = { path = "../tela-app-abi" }

[lints]
workspace = true
