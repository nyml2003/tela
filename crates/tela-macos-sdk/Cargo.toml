[package]
name = "tela-macos-sdk"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Tela macOS AppKit and Metal development SDK host"

[dependencies]
tela-native-sdk-runtime = { path = "../tela-native-sdk-runtime" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSApplication",
    "NSColor",
    "NSControl",
    "NSCursor",
    "NSEvent",
    "NSFont",
    "NSGraphics",
    "NSResponder",
    "NSRunningApplication",
    "NSText",
    "NSTextField",
    "NSView",
    "NSWindow",
    "objc2-core-foundation",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSDate",
    "NSGeometry",
    "NSNotification",
    "NSObject",
    "NSString",
    "NSTimer",
] }
pollster = "0.4"
raw-window-handle = "0.6"
tela-app-abi = { path = "../tela-app-abi" }
tela-contract = { path = "../tela-contract" }
tela-render-wgpu = { path = "../tela-render-wgpu" }
ureq = { version = "3.3", default-features = false }
wgpu = "30"

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[[bin]]
name = "tela-macos-sdk"
path = "src/main.rs"
