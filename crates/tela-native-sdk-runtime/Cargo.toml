[package]
name = "tela-native-sdk-runtime"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Desktop Tela SDK cache and lifecycle support layered over the neutral guest runtime"

[dependencies]
tela-bundle = { path = "../tela-bundle" }
tela-guest-runtime = { path = "../tela-guest-runtime" }

[dev-dependencies]
tela-app-abi = { path = "../tela-app-abi" }
serde_json = "1"

[lints]
workspace = true

[[bin]]
name = "tela-sdk-verify"
path = "src/bin/tela-sdk-verify.rs"
