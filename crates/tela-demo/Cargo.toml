[package]
name = "tela-demo"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "tela 演示：浏览器 canvas 的共享 UI 场景"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# WebGPU 网页入口（wasm-bindgen 生成 JS glue；启用后 wasm 含 wbindgen 导入，需 wasm-bindgen 加载）。
webgpu = ["dep:wasm-bindgen", "dep:web-sys", "dep:js-sys", "dep:wasm-bindgen-futures", "wgpu", "dep:tela-render-wgpu"]

[dependencies]
tela-contract = { path = "../tela-contract" }
tela-core = { path = "../tela-core" }
tela-widgets = { path = "../tela-widgets" }
tela-render-raster = { path = "../tela-render-raster" }
tela-render-wgpu = { path = "../tela-render-wgpu", optional = true }
wgpu = { version = "30", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = [
  "console", "Document", "Element", "HtmlCanvasElement", "Window", "Navigator", "Location",
] }

[lints.rust]
unsafe_code = "deny"
