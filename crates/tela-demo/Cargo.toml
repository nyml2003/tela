[package]
name = "tela-demo"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "tela 文件管理器演示应用 guest"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# 平台 SDK 通用 WASM guest：只导出应用 ABI，不依赖浏览器 Canvas 或 GPU surface。
app-wasm = ["dep:tela-app-abi"]

[dependencies]
tela-contract = { path = "../tela-contract" }
tela-core = { path = "../tela-core" }
tela-fonts = { path = "../tela-fonts" }
tela-icon = { path = "../tela-icon" }
tela-text = { path = "../tela-text" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tela-widgets = { path = "../tela-widgets" }
tela-ui = { path = "../tela-ui" }
tela-app-abi = { path = "../tela-app-abi", optional = true }

[lints.rust]
unsafe_code = "deny"
