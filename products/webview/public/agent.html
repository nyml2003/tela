<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131618">
<title>Tela Agent Lab</title>
<style>
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #f3f5f2; }
  body { position: fixed; inset: 0; }
  canvas { display: block; width: 100dvw; height: 100dvh; touch-action: none; }
  canvas:focus { outline: none; }
  #boot-status { position: fixed; inset: 0; display: grid; place-items: center; background: #131618;
                 color: #c9d1cd; font: 13px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; }
  #boot-status[hidden] { display: none; }
  #startup-error { position: fixed; right: 16px; bottom: 16px; max-width: min(560px, calc(100vw - 32px));
                   padding: 10px 12px; border: 1px solid #bf3329; border-radius: 6px;
                   background: #fff0ed; color: #731d18; font: 13px/1.5 system-ui, sans-serif; }
</style>
</head>
<body>
<canvas id="agent-canvas" aria-label="Tela Agent Lab" tabindex="0"></canvas>
<div id="boot-status" role="status">Starting Tela Agent Lab...</div>
<div id="startup-error" role="alert" hidden></div>
<script type="module" src="./agent-bootstrap.js"></script>
</body>
</html>
