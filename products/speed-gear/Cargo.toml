[package]
name = "tela-product-speed-gear"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Tela Windows x64 speed gear product"
build = "build.rs"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
tela-contract = { path = "../../crates/kernel/contract" }
tela-icon-resources = { path = "../../crates/presentation/resources/icons" }
tela-target-win32-static = { path = "../../crates/targets/win32-static" }
tela-text-resources = { path = "../../crates/presentation/resources/text" }
tela-speed-gear = { path = "../../apps/speed-gear" }

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[[bin]]
name = "tela-speed-gear-host"
path = "src/main.rs"
