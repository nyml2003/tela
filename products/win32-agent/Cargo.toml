[package]
name = "tela-product-win32-agent"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Tela Win32 static Agent workbench product assembly"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
tela-agent-demo = { path = "../../apps/agent-demo" }
tela-contract = { path = "../../crates/kernel/contract" }
tela-icon-resources = { path = "../../crates/presentation/resources/icons" }
tela-target-win32 = { path = "../../crates/targets/win32" }
tela-text-resources = { path = "../../crates/presentation/resources/text" }

[lints]
workspace = true

[[bin]]
name = "tela-win32-agent-host"
path = "src/main.rs"
