[package]
name = "tela-product-desktop-guest"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Tela desktop dynamic guest product assembly"

[lib]
crate-type = ["cdylib"]

[dependencies]
tela-app-abi = { path = "../../crates/delivery/app-abi" }
tela-app-runtime = { path = "../../crates/delivery/app-runtime" }
tela-app-session = { path = "../../crates/delivery/app-session" }
tela-bridge = { path = "../../crates/delivery/bridge", features = ["guest"] }
tela-contract = { path = "../../crates/kernel/contract" }
tela-desktop-demo = { path = "../../apps/desktop-demo", features = ["app-runtime"] }
tela-icon-resources = { path = "../../crates/presentation/resources/icons" }
tela-text-resources = { path = "../../crates/presentation/resources/text" }

[lints.rust]
# `export_guest!` locally allows its audited extern "C" exports; handwritten product code is denied.
unsafe_code = "deny"
