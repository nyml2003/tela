[package]
name = "tela-product-win32-editor"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Tela Win32 static text editor product assembly (static-link shell + DSL app)"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
tela-contract = { path = "../../crates/kernel/contract" }
tela-desktop-runtime = { path = "../../crates/delivery/desktop-runtime" }
tela-utils = { path = "../../crates/support/utils" }
tela-icon-resources = { path = "../../crates/presentation/resources/icons" }
tela-app-runtime = { path = "../../crates/delivery/app-runtime" }
tela-target-win32 = { path = "../../crates/targets/win32" }
tela-text-resources = { path = "../../crates/presentation/resources/text" }
tela-win32-editor = { path = "../../apps/win32-editor", features = ["app-runtime"] }

[dev-dependencies]
pollster = "0.4"
tela-app-session = { path = "../../crates/delivery/app-session" }
tela-bridge = { path = "../../crates/delivery/bridge", features = ["host"] }
tela-render-wgpu = { path = "../../crates/presentation/renderers/wgpu" }
wgpu = "30"

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[[bin]]
name = "tela-win32-editor-host"
path = "src/main.rs"
