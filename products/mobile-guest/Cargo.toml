[package]
name = "tela-product-mobile-guest"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Tela mobile dynamic guest product assembly"

[lib]
crate-type = ["cdylib"]

[dependencies]
tela-app-abi = { path = "../../crates/delivery/app-abi" }
tela-contract = { path = "../../crates/kernel/contract" }
tela-icon-resources = { path = "../../crates/presentation/resources/icons" }
tela-mobile-demo = { path = "../../apps/mobile-demo", features = ["app-runtime"] }
tela-text-resources = { path = "../../crates/presentation/resources/text" }

[lints.rust]
# `export_guest!` locally allows its audited extern "C" exports; handwritten product code is denied.
unsafe_code = "deny"
