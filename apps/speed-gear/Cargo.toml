[package]
name = "tela-speed-gear"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Tela Windows x64 speed control utility"

[features]
default = []
app-runtime = []

[dependencies]
tela-app-runtime = { path = "../../crates/delivery/app-runtime" }
tela-app-session = { path = "../../crates/delivery/app-session" }
tela-contract = { path = "../../crates/kernel/contract" }
tela-core = { path = "../../crates/kernel/core" }
tela-desktop-ui-kit = { path = "../../crates/ui/desktop-kit" }
tela-desktop-ui-dsl = { path = "../../crates/ui/desktop-ui-dsl" }
tela-ui-dsl = { path = "../../crates/ui/dsl" }
tela-ui-foundation = { path = "../../crates/ui/foundation" }
tela-speed-gear-protocol = { path = "../speed-gear-protocol" }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
unsafe_code = "deny"

[dev-dependencies]
tela-icon-resources = { path = "../../crates/presentation/resources/icons" }
tela-text-resources = { path = "../../crates/presentation/resources/text" }
