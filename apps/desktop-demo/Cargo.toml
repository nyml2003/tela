[package]
name = "tela-desktop-demo"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Tela first-party desktop file manager application"

[features]
default = []
# 公开 desktop application runtime，供产品装配选择资源与交付路线。
app-runtime = []

[dependencies]
tela-contract = { path = "../../crates/kernel/contract" }
tela-core = { path = "../../crates/kernel/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tela-ui-foundation = { path = "../../crates/ui/foundation" }
tela-ui-dsl = { path = "../../crates/ui/dsl" }
tela-desktop-ui-kit = { path = "../../crates/ui/desktop-kit" }
tela-desktop-ui-dsl = { path = "../../crates/ui/desktop-ui-dsl" }

[dev-dependencies]
# 回归测试使用真实的受控资源核对 frame；运行时依赖仍由产品根注入。
tela-icon-resources = { path = "../../crates/presentation/resources/icons" }
tela-render-raster = { path = "../../crates/presentation/renderers/raster" }
tela-text-resources = { path = "../../crates/presentation/resources/text" }

[lints.rust]
unsafe_code = "deny"
